version: 2
updates:
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'chore(deps)'
      prefix-development: 'chore(deps-dev)'
    groups:
      # Patterns are matched against the full package name, so a bare `eslint*` does
      # not match `@eslint/js` and `@typescript-eslint/*` does not match the flat
      # `typescript-eslint` meta-package. That gap split the linting stack across
      # four separate PRs, none of which could install on its own: `@eslint/js@10`
      # peers on `eslint@^10`, and `typescript-eslint@8.46` refused `eslint@10`.
      # Scoped and unscoped forms are therefore both spelled out.
      dev-tooling:
        patterns:
          - 'eslint'
          - 'eslint-*'
          - '@eslint/*'
          - 'typescript-eslint'
          - '@typescript-eslint/*'
          - 'typescript'
          - 'prettier'
          - 'globals'
          - 'husky'
          - '@commitlint/*'
          - 'lint-staged'
      testing:
        patterns: ['vitest', '@vitest/*', '@playwright/*', 'playwright']
      otel:
        patterns: ['@opentelemetry/*']
      # TaskFlow's runtime. Grouped because it is the system under test rather
      # than the product: a bump here can only break the application the pipeline
      # is pointed at, and reviewing those together is the whole of the review.
      taskflow:
        patterns:
          - 'express'
          - '@types/express'
          - 'better-sqlite3'
          - '@types/better-sqlite3'
    ignore:
      # The SDK version is pinned deliberately — a bump can move classifier behaviour,
      # so it is upgraded manually with an eval run attached to the PR.
      - dependency-name: '@anthropic-ai/sdk'

      # typescript-eslint caps its peer range at `typescript <6.1.0`, and every
      # type-aware rule — including the agent I/O guardrail — runs through it. A
      # major TypeScript bump is unsatisfiable until that cap moves, so it is held
      # rather than reopened weekly. Tracked in #124.
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']

      # @types/node is versioned by Node major, so its major has to track
      # engines.node rather than the newest release. @types/node@26 declares
      # node:ffi and node:quic, which Node 24 does not have — importing them
      # would type-check and then throw. Held until the runtime floor moves, and
      # moved by hand when it does, as it was for Node 24;
      # tests/unit/node-floor.test.ts fails if the two ever disagree.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']

      # The OpenTelemetry SDK's 3.x line requires Node >=22.15, which the 24.15 floor
      # clears, so the runtime is no longer the reason. What decides it now is the
      # public interface 3.0 changed (removed packages and exports, a new build
      # layout), checked against the tracing code and its span tests, with
      # @opentelemetry/api 1.10 in the same PR. Minor and patch releases of the 2.x
      # SDK still arrive through the otel group.
      - dependency-name: '@opentelemetry/*'
        update-types: ['version-update:semver-major']

      # The API is the exception the rule above misses: 1.10 is a minor release, and
      # every 2.x SDK package declares a peer range of `@opentelemetry/api <1.10.0`.
      # It installs and the tests pass, which is what makes it dangerous — the SDK
      # makes no promise about it. Node never held it (1.10 accepts >=8); every 3.x
      # package peers on `>=1.10.0 <1.11.0`, so it moves with the SDK major, not
      # before it.
      - dependency-name: '@opentelemetry/api'
        versions: ['>=1.10.0']

  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: monthly
    commit-message:
      prefix: 'ci(deps)'
    groups:
      # Every step of github/codeql-action in a workflow has to run the same
      # release: `init` writes a configuration that `analyze` refuses to load
      # from another version. Bumped one step at a time, each pull request fails
      # on its own — #264 and #266 did exactly that.
      codeql-action:
        patterns: ['github/codeql-action*']
