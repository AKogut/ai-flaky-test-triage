version: 2
updates:
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'chore(deps)'
      prefix-development: 'chore(deps-dev)'
    groups:
      # Patterns are matched against the full package name, so a bare `eslint*` does
      # not match `@eslint/js` and `@typescript-eslint/*` does not match the flat
      # `typescript-eslint` meta-package. That gap split the linting stack across
      # four separate PRs, none of which could install on its own: `@eslint/js@10`
      # peers on `eslint@^10`, and `typescript-eslint@8.46` refused `eslint@10`.
      # Scoped and unscoped forms are therefore both spelled out.
      dev-tooling:
        patterns:
          - 'eslint'
          - 'eslint-*'
          - '@eslint/*'
          - 'typescript-eslint'
          - '@typescript-eslint/*'
          - 'typescript'
          - 'prettier'
          - 'globals'
          - 'husky'
          - '@commitlint/*'
          - 'lint-staged'
      testing:
        patterns: ['vitest', '@vitest/*', '@playwright/*', 'playwright']
      otel:
        patterns: ['@opentelemetry/*']
      # TaskFlow's runtime. Grouped because it is the system under test rather
      # than the product: a bump here can only break the application the pipeline
      # is pointed at, and reviewing those together is the whole of the review.
      taskflow:
        patterns:
          - 'express'
          - '@types/express'
          - 'better-sqlite3'
          - '@types/better-sqlite3'
    ignore:
      # The SDK version is pinned deliberately — a bump can move classifier behaviour,
      # so it is upgraded manually with an eval run attached to the PR.
      - dependency-name: '@anthropic-ai/sdk'

      # typescript-eslint caps its peer range at `typescript <6.1.0`, and every
      # type-aware rule — including the agent I/O guardrail — runs through it. A
      # major TypeScript bump is unsatisfiable until that cap moves, so it is held
      # rather than reopened weekly. Tracked in #124.
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']

      # lint-staged 17 requires Node >=22.22.1. A commit-hook helper should not set
      # the runtime floor for a project that ships nothing depending on it; revisit
      # when the repository moves to Node 24.
      - dependency-name: 'lint-staged'
        update-types: ['version-update:semver-major']

      # @types/node is versioned by Node major, so its major has to track
      # engines.node rather than the newest release. @types/node@26 declares
      # node:ffi and node:quic, which Node 22 does not have — importing them
      # would type-check and then throw. Held until the runtime floor moves;
      # tests/unit/node-floor.test.ts fails if the two ever disagree.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: monthly
    commit-message:
      prefix: 'ci(deps)'
