version: 2
updates:
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    # A release is proposed once it is two weeks old, not the day it ships. A
    # compromised or broken version is usually found and pulled within days, and
    # a pipeline that installs on every pull request is exactly where it would
    # land first. Every dependency picked by hand in this repository already
    # followed this rule; this makes Dependabot follow it too.
    #
    # Security updates are not delayed: cooldown applies to version updates only.
    cooldown:
      default-days: 14
    commit-message:
      prefix: 'chore(deps)'
      prefix-development: 'chore(deps-dev)'
    groups:
      # Patterns are matched against the full package name, so a bare `eslint*` does
      # not match `@eslint/js` and `@typescript-eslint/*` does not match the flat
      # `typescript-eslint` meta-package. That gap split the linting stack across
      # four separate PRs, none of which could install on its own: `@eslint/js@10`
      # peers on `eslint@^10`, and `typescript-eslint@8.46` refused `eslint@10`.
      # Scoped and unscoped forms are therefore both spelled out.
      dev-tooling:
        patterns:
          - 'eslint'
          - 'eslint-*'
          - '@eslint/*'
          - 'typescript-eslint'
          - '@typescript-eslint/*'
          - 'typescript'
          - 'prettier'
          - 'globals'
          - 'husky'
          - '@commitlint/*'
          - 'lint-staged'
      testing:
        patterns: ['vitest', '@vitest/*', '@playwright/*', 'playwright']
      otel:
        patterns: ['@opentelemetry/*']
      # TaskFlow's runtime. Grouped because it is the system under test rather
      # than the product: a bump here can only break the application the pipeline
      # is pointed at, and reviewing those together is the whole of the review.
      taskflow:
        patterns:
          - 'express'
          - '@types/express'
          - 'better-sqlite3'
          - '@types/better-sqlite3'
    ignore:
      # The SDK version is pinned deliberately — a bump can move classifier behaviour,
      # so it is upgraded manually with an eval run attached to the PR.
      - dependency-name: '@anthropic-ai/sdk'

      # The API moves with the SDK, not ahead of it. sdk-trace, core and resources
      # 3.1 all declare a peer range of `@opentelemetry/api >=1.10.0 <1.11.0`, so an
      # API minor released before the SDK that accepts it would install, pass every
      # test and run outside what the SDK supports — what #239 was for the 2.x line.
      # Move this bound when the SDK's peer range moves.
      - dependency-name: '@opentelemetry/api'
        versions: ['>=1.11.0']

      # TypeScript 6.0 is in, and 7 is held. typescript-eslint still caps its peer
      # range at `typescript <6.1.0`, and every type-aware rule — including the
      # agent I/O guardrail — runs through it; its parser and plugin throw on 7.0.
      # Its only route to 7 so far is an experimental tsgo backend, through an
      # optional `@typescript/native` peer that starts at 7.1, which is still in
      # beta. The major bump stays unsatisfiable until the `typescript` peer admits
      # 7, so it is held rather than reopened weekly. Tracked in #124.
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']

      # @types/node is versioned by Node major, so its major has to track
      # engines.node rather than the newest release. @types/node@26 declares
      # node:ffi and node:quic, which Node 24 does not have — importing them
      # would type-check and then throw. Held until the runtime floor moves, and
      # moved by hand when it does, as it was for Node 24;
      # tests/unit/node-floor.test.ts fails if the two ever disagree.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: monthly
    # Same rule as npm above. Actions run with this repository's token, so a
    # release that turns out to be malicious is worth waiting out more, not less.
    cooldown:
      default-days: 14
    commit-message:
      prefix: 'ci(deps)'
    groups:
      # Every step of github/codeql-action in a workflow has to run the same
      # release: `init` writes a configuration that `analyze` refuses to load
      # from another version. Bumped one step at a time, each pull request fails
      # on its own — #264 and #266 did exactly that.
      codeql-action:
        patterns: ['github/codeql-action*']
    ignore:
      # The v2.6.0 image cannot be pulled: its index on ghcr.io points at an
      # amd64 manifest that was deleted, so every Scorecard run fails before it
      # starts (ossf/scorecard-action#1752). The workflow stays on v2.5.0 until a
      # release that pulls; drop this once that issue is closed.
      - dependency-name: 'ossf/scorecard-action'
        versions: ['2.6.0']
