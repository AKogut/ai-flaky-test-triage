name: CodeQL

# Static analysis of the TypeScript and of the workflows themselves. The second
# matters here more than usual: this repository's CI posts comments with a
# write-scoped token and handles text from failing tests, and the `actions`
# query pack is what notices an expression interpolated into a `run:` script.
#
# A separate workflow rather than a job in ci.yml, so a slow analysis never
# holds up the checks a pull request is required to pass, and so the badge in
# the README reports this and nothing else.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly, so a new query catches old code even in a quiet week.
    - cron: '23 4 * * 1'

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # `build-mode: none` for both: TypeScript is analysed from source, and a
      # build would only add the compiled copies of the same code.
      - uses: github/codeql-action/init@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-and-quality

      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /language:${{ matrix.language }}
