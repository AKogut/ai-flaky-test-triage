name: CI

# The entire pipeline lives in this one workflow. Nothing here runs outside a job.
#
# Each job is gated on a capability flag computed by the `hygiene` job from files
# that exist in the checkout. A job activates by itself the moment the milestone
# that introduces it lands, and until then it skips rather than failing — so `main`
# stays green throughout the build-out without anyone editing this file per merge.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'

jobs:
  # ---------------------------------------------------------------------------
  # Always runs. Guards the parts of the repository that exist today.
  # ---------------------------------------------------------------------------
  hygiene:
    name: Repository hygiene
    runs-on: ubuntu-latest
    outputs:
      has-code: ${{ steps.detect.outputs.has-code }}
      has-unit: ${{ steps.detect.outputs.has-unit }}
      has-e2e: ${{ steps.detect.outputs.has-e2e }}
      has-eval: ${{ steps.detect.outputs.has-eval }}
      has-agents: ${{ steps.detect.outputs.has-agents }}
    steps:
      - uses: actions/checkout@v7

      - name: Detect which parts of the pipeline exist yet
        id: detect
        run: |
          flag() {
            if [ -e "$2" ]; then
              echo "$1=true" >> "$GITHUB_OUTPUT"
            else
              echo "$1=false" >> "$GITHUB_OUTPUT"
              echo "::notice::$2 not present — the '$1' jobs will skip."
            fi
          }
          flag has-code   package.json
          flag has-unit   vitest.config.ts
          flag has-e2e    playwright.config.ts
          flag has-eval   eval/run-eval.ts
          flag has-agents agents/run.ts

      - name: Validate workflow and issue-template YAML
        run: |
          python3 -m pip install --quiet --disable-pip-version-check pyyaml
          python3 - <<'PY'
          import sys, pathlib, yaml
          bad = []
          for p in list(pathlib.Path('.github').rglob('*.yml')) + list(pathlib.Path('.github').rglob('*.yaml')):
              try:
                  yaml.safe_load(p.read_text())
              except Exception as e:
                  bad.append(f"{p}: {e}")
          if bad:
              print("\n".join(bad)); sys.exit(1)
          print("all .github YAML parses")
          PY

      - name: Required documentation is present
        run: |
          missing=0
          for f in README.md CONTRIBUTING.md SECURITY.md CODE_OF_CONDUCT.md LICENSE \
                   docs/architecture.md docs/taxonomy.md docs/agent-design.md \
                   docs/eval-methodology.md docs/limitations-and-guardrails.md \
                   docs/branching-strategy.md docs/adr/README.md; do
            [ -f "$f" ] || { echo "::error::missing $f"; missing=1; }
          done
          exit $missing

      - name: ADR index matches the files on disk
        run: |
          python3 - <<'PY'
          import pathlib, re, sys
          index = pathlib.Path('docs/adr/README.md').read_text()
          files = {p.name for p in pathlib.Path('docs/adr').glob('0*-*.md')
                   if p.name != '0000-template.md'}
          linked = set(re.findall(r'\((\d{4}-[a-z0-9-]+\.md)\)', index)) - {'0000-template.md'}
          if files - linked:
              print("::error::ADRs not listed in docs/adr/README.md:", files - linked); sys.exit(1)
          if linked - files:
              print("::error::index links a missing ADR:", linked - files); sys.exit(1)
          print(f"{len(files)} ADRs indexed")
          PY

      - name: README status banner matches ROADMAP.md
        if: steps.detect.outputs.has-code == 'true'
        run: |
          npm ci --silent
          npm run docs:status:check

      # The rubric the model is sent and the rubric the dataset was labelled by
      # are one file; docs/taxonomy.md carries a generated copy. Drift between
      # them turns every accuracy figure into agreement with a rule nobody is
      # applying, and nothing about the repository looks different afterwards.
      - name: Documented rubric matches the one the prompt embeds
        if: steps.detect.outputs.has-code == 'true'
        run: npm run prompts:sync:check

      # Runs on every push rather than only when prompts/ or agents/ change. The
      # check is offline and takes under a second, and the changes that
      # invalidate a cassette are not confined to those directories — the context
      # assembler, the sanitiser, the response schema and the sampling default
      # all feed the key. A path filter here would be a filter that is wrong the
      # first time somebody edits a fifth thing.
      - name: Committed cassettes still answer the questions the pipeline asks
        if: steps.detect.outputs.has-code == 'true'
        run: npm run cassettes:check

      # Label leakage is the quietest way to inflate an accuracy number, so this
      # runs on every push rather than only when the dataset changes — a leaked
      # term arrives just as easily through an edit to the checker itself.
      - name: Golden dataset hygiene
        if: steps.detect.outputs.has-code == 'true'
        run: npm run eval:lint

      - name: No internal doc links point at missing files
        run: |
          python3 - <<'PY'
          import pathlib, re, sys
          bad = []
          for md in list(pathlib.Path('docs').rglob('*.md')) + [pathlib.Path('README.md'),
                    pathlib.Path('CONTRIBUTING.md'), pathlib.Path('SECURITY.md')]:
              for target in re.findall(r'\]\(([^)#:]+\.md)[^)]*\)', md.read_text()):
                  if not (md.parent / target).resolve().exists():
                      bad.append(f"{md} -> {target}")
          if bad:
              print("::error::broken doc links:\n" + "\n".join(bad)); sys.exit(1)
          print("doc links resolve")
          PY

  # ---------------------------------------------------------------------------
  # The PR title becomes the squash commit on main, so it is validated by the
  # same commitlint config the local commit-msg hook uses. Deliberately not a
  # regex duplicated into this file: a second copy of the type and scope lists
  # would drift, and the failure mode is a commit that passes the hook and then
  # fails here, which is worse than either gate alone.
  # ---------------------------------------------------------------------------
  pr-title:
    name: PR title convention
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Lint the pull-request title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          if ! printf '%s' "$TITLE" | npx --no -- commitlint; then
            echo "::error::PR title is not a valid Conventional Commit: '$TITLE'"
            echo "Allowed types and scopes: docs/branching-strategy.md"
            echo "Example: feat(triage): add two-axis output schema"
            exit 1
          fi
          echo "ok: $TITLE"

  # ---------------------------------------------------------------------------
  # M0 — static quality gates.
  # ---------------------------------------------------------------------------
  static:
    name: Static analysis
    needs: hygiene
    if: needs.hygiene.outputs.has-code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck

  # ---------------------------------------------------------------------------
  # M5 — unit tests, contract tests.
  # ---------------------------------------------------------------------------
  unit:
    name: Unit & contract tests
    needs: hygiene
    if: needs.hygiene.outputs.has-unit == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      # test:coverage rather than `test:unit -- --coverage`, so the invocation CI
      # runs is the one a contributor can run locally by name. The thresholds in
      # vitest.config.ts fail the job on their own.
      - run: npm run test:coverage

      # The README's headline claim, run the way a stranger runs it: a clean
      # checkout, `npm ci`, and nothing else. The unit tests already drive the
      # demo's `main`, but only this proves the *command* works — a broken
      # binary, a missing bundled file or a script rename would pass every test
      # in the suite and fail the first person who tried it.
      #
      # No ANTHROPIC_API_KEY is set on this job on purpose. If the demo ever
      # needs one, it fails here rather than in a reader's terminal.
      - name: The credential-free demo still runs
        run: npm run demo

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-coverage
          path: coverage/
          retention-days: 7

  # ---------------------------------------------------------------------------
  # M5 — end-to-end. Deliberately does NOT retry: retries would erase the
  # intermittency signal the whole pipeline depends on.
  # ---------------------------------------------------------------------------
  e2e:
    name: E2E tests
    needs: hygiene
    if: needs.hygiene.outputs.has-e2e == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Run Playwright
        id: e2e
        continue-on-error: true
        run: npm run test:e2e
      # `test-results/` holds the trace and the screenshot for each failure, and
      # a trace is the evidence the triage agent reads — network timing, the DOM
      # at the moment it failed, the console. Without it a failure in CI is a
      # message and a guess, which is the position this project exists to
      # improve on. Kept whatever the outcome: a red run is the one worth
      # keeping.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: |
            results.json
            playwright-report/
            test-results/
          retention-days: 14
      - name: Record whether the suite was red
        run: echo "e2e_outcome=${{ steps.e2e.outcome }}" >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------------
  # M2/M3 — the eval gate. Blocks merge on classifier regression.
  # ---------------------------------------------------------------------------
  eval:
    name: Evaluation gate
    needs: hygiene
    if: needs.hygiene.outputs.has-eval == 'true'
    runs-on: ubuntu-latest
    steps:
      # Full history. The gate measures a regression against the metrics
      # recorded on main, and the scope check needs a merge base — neither is
      # computable from the single commit checkout fetches by default.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci

      # This job is a required check, so it must report on every pull request —
      # a required check that skips leaves the PR waiting for a status that
      # never arrives. It therefore always runs, and this flag decides how much
      # work it does rather than whether it runs at all. Today the whole thing
      # is free: no model, no network. From M3 the flag is what stops a
      # docs-only change from spending money on a model.
      # Fails safe: anything other than a confidently empty diff reports
      # "changed". Guessing wrong in that direction wastes a run; guessing wrong
      # the other way silently skips the evaluation on a change that needed it,
      # which is the failure nobody notices. An earlier version defaulted the
      # other way and reported "nothing changed" on a pull request that rewrote
      # eval/ — the merge base was unreachable from a depth-1 checkout, the diff
      # came back empty, and the check believed it.
      - name: Did anything the evaluation depends on change?
        id: scope
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"; exit 0
          fi

          base='${{ github.event.pull_request.base.sha }}'
          if ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "::warning::Base commit $base unreachable — assuming the evaluation is in scope."
            exit 0
          fi

          changed_files=$(git diff --name-only "$base" HEAD)
          if [ -z "$changed_files" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "::warning::Empty diff against the base — assuming the evaluation is in scope."
          elif printf '%s\n' "$changed_files" | grep -Eq '^(agents|eval|prompts)/'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No change under agents/, eval/ or prompts/ — from M3 the model run is skipped here."
          fi

      # eval/report.md attributes its numbers to a prompt version. Editing that
      # version in place keeps the record and breaks the link, so a published
      # version — and the rubric substituted into it — is immutable. This runs
      # here rather than in hygiene because it needs the full history that job
      # does not fetch; it throws rather than passing if the ref is unreadable.
      - name: Published prompt versions were not edited in place
        run: npm run prompts:freeze -- --ref=origin/main

      - name: Run golden-dataset evaluation
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # No key (fork PR) → replay mode against committed cassettes.
          SENTRA_REPLAY: ${{ secrets.ANTHROPIC_API_KEY == '' && '1' || '' }}
          SENTRA_EVAL_SCOPE_CHANGED: ${{ steps.scope.outputs.changed }}
        run: npm run eval -- --gate

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-report
          path: |
            eval/report.md
            eval/metrics.json
          retention-days: 30

  # ---------------------------------------------------------------------------
  # M6/M7/M8 — flakiness analysis and agent triage. Never fails the build.
  # ---------------------------------------------------------------------------
  analyze:
    name: Flakiness analysis & triage
    needs: [hygiene, e2e]
    if: always() && needs.hygiene.outputs.has-agents == 'true'
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # agents need real diff history

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci

      - uses: actions/download-artifact@v4
        with:
          name: test-results

      # ADR-0004: keyed cache with fallback to main. Only the main-branch run writes.
      - name: Restore run history
        uses: actions/cache/restore@v4
        with:
          path: .flakemetry/history.json
          key: history-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            history-${{ github.ref_name }}-
            history-main-

      - name: flakemetry analysis
        run: npm run flakemetry:analyze

      - name: Agent triage
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: npm run agents:analyze

      - name: Upload report and spans
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: triage-report
          path: |
            report.md
            analysis.json
            otel-spans.json
          retention-days: 30

      - name: Upsert PR comment
        if: github.event_name == 'pull_request' && hashFiles('report.md') != ''
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const MARKER = '<!-- sentra:report -->';
            const body = MARKER + '\n' + fs.readFileSync('report.md', 'utf8');
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const existing = (await github.paginate(
              github.rest.issues.listComments, { owner, repo, issue_number }
            )).find(c => c.body?.startsWith(MARKER));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

      - name: Persist run history (main only — ADR-0004)
        if: github.ref == 'refs/heads/main'
        uses: actions/cache/save@v4
        with:
          path: .flakemetry/history.json
          key: history-main-${{ github.run_id }}
